name: Run LS (Manual + Daily)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC

jobs:
  list-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Run ls command
        run: ls -la
